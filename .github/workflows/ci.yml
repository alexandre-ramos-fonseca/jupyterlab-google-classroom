name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [student, teacher]
    defaults:
      run:
        working-directory: packages/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: packages/${{ matrix.component }}/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Provide JupyterLab package-manager alias
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(command -v yarn)" "$RUNNER_TEMP/bin/jlpm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install JavaScript dependencies
        run: yarn install --immutable
      - name: Install Python build tools
        run: python -m pip install --upgrade pip build 'jupyterlab>=4.5,<5'
      - name: Build TypeScript and JupyterLab extension
        run: yarn build
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build --wheel
